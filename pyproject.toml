[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spring-engine"
version = "0.5.0"
description = "Machine learning pipeline for forecasting phenological events from climate data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "dask>=2026.3.0",
    "netCDF4>=1.7.4",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pyarrow>=24.0.0",
    "requests>=2.32.5",
    "tqdm>=4.67.3",
    "xarray>=2026.4.0"
]

[project.urls]
repository = "https://github.com/corvus333-dev/spring-engine"

[project.optional-dependencies]
accel = ["Bottleneck>=1.6.0"]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[project.scripts]
spring-engine = "spring_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]